<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>원고 편집</title>
<style>
  :root { --red:#c62828; --red-bg:#fdecea; --grey:#9e9e9e; --accent:#1565c0; --line:#e0e0e0; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:"Malgun Gothic","맑은 고딕",sans-serif; font-size:16px; color:#212121; background:#fafafa; }
  header { position:sticky; top:0; z-index:10; background:#fff; border-bottom:1px solid var(--line); padding:10px 16px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
  h1 { font-size:18px; margin:0 0 8px; }
  .bar { display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; }
  audio { height:34px; width:420px; max-width:100%; }
  .est { font-weight:bold; padding:4px 10px; border-radius:6px; background:#e8f5e9; color:#2e7d32; }
  .est.over { background:var(--red-bg); color:var(--red); }
  button { font:inherit; font-size:14px; padding:5px 12px; border:1px solid #bdbdbd; border-radius:6px; background:#fff; cursor:pointer; }
  button:hover { background:#f0f0f0; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button.primary:hover { background:#0d47a1; }
  .status { font-size:13px; color:#757575; }
  .status.dirty { color:var(--red); }
  .help { font-size:13px; color:#616161; margin-top:6px; line-height:1.6; }
  .help b { color:#212121; }
  .legend span { display:inline-block; padding:0 6px; border-radius:4px; margin-right:4px; }
  main { max-width:1000px; margin:0 auto; padding:10px 16px 120px; }
  .row { display:flex; gap:8px; align-items:flex-start; padding:5px 6px; border-bottom:1px solid #f0f0f0; border-left:4px solid transparent; }
  .row:hover { background:#f5f9ff; }
  .row.playing { background:#fff8e1; border-left-color:#ffb300; }
  .row.dup { border-left-color:var(--red); background:var(--red-bg); }
  .row.deleted .txt, .row.deleted .time { color:var(--grey); text-decoration:line-through; }
  .play { border:none; background:none; color:var(--accent); cursor:pointer; font-size:15px; padding:0 2px; line-height:24px; }
  .row input { margin-top:5px; width:17px; height:17px; cursor:pointer; }
  .time { font-family:Consolas,monospace; font-size:13px; color:#757575; width:62px; flex:none; line-height:24px; cursor:pointer; }
  .txt { flex:1; line-height:24px; }
  .w { cursor:pointer; border-radius:3px; padding:0 1px; }
  .w:hover { background:#e3f2fd; }
  .w.cut { color:var(--grey); text-decoration:line-through; background:#eeeeee; }
  .w.rep { color:var(--red); font-weight:bold; }
  .row.dup .txt { color:var(--red); }
  .tag { font-size:12px; padding:1px 7px; border-radius:10px; margin-left:6px; white-space:nowrap; text-decoration:none !important; display:inline-block; }
  .tag.callout { background:#ede7f6; color:#5e35b1; }
  .tag.after { background:#eceff1; color:#546e7a; }
  .tag.dupt { background:#fff; color:var(--red); border:1px solid var(--red); cursor:pointer; }
  .divider { margin:18px 0 8px; padding:6px 10px; background:#eceff1; color:#455a64; font-weight:bold; border-radius:6px; }
  #panel { position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:50; display:flex; align-items:center; justify-content:center; }
  #panel .box { background:#fff; width:min(760px,92vw); border-radius:10px; padding:16px 20px; box-shadow:0 8px 30px rgba(0,0,0,.25); }
  #panel h2 { font-size:18px; margin:0 0 10px; }
  #panel pre { background:#263238; color:#eceff1; font-family:Consolas,"Malgun Gothic",monospace; font-size:13px; height:340px; overflow:auto; padding:10px; border-radius:6px; white-space:pre-wrap; }
  .flash { animation: fl 1.2s; }
  @keyframes fl { 0%{background:#ffe082;} 100%{background:inherit;} }
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <div class="bar">
    <audio id="au" controls preload="auto"></audio>
    <span class="est" id="est"></span>
    <button id="nextDup" title="다음 중복 의심 줄로 이동 (N)">다음 중복 의심 ↓</button>
    <button id="onlyDup">중복 의심만 보기</button>
    <button id="reset">처음 상태로</button>
    <button id="save">원고 저장</button>
    <button class="primary" id="build" style="display:none">송출 파일 만들기</button>
    <span class="status" id="status"></span>
  </div>
  <div class="help">
    <b>▶ 또는 시간</b>: 그 지점부터 듣기 · <b>☐ 체크</b>: 줄 전체 삭제 · <b>단어 클릭</b>: 그 단어만 삭제(다시 클릭하면 복구) · <b>스페이스</b>: 재생/정지 · <b>N</b>: 다음 중복 의심
    <span class="legend">&nbsp;|&nbsp;<span style="background:var(--red-bg);color:var(--red)">빨간색 = 중복 의심</span><span style="background:#eee;color:#9e9e9e;text-decoration:line-through">회색 취소선 = 삭제</span></span>
  </div>
</header>
<main id="list"></main>
<div id="panel" style="display:none">
  <div class="box">
    <h2 id="ptitle">송출 파일 만드는 중…</h2>
    <pre id="plog"></pre>
    <div style="text-align:right"><button id="pclose" disabled>닫기</button></div>
  </div>
</div>

<script>
const DATA = /*DATA_BEGIN*/null/*DATA_END*/;
const INIT = /*INIT_BEGIN*/null/*INIT_END*/;   // 편집 서버가 원고.txt 에서 읽어 넣어 주는 현재 상태
const SERVER = location.protocol.startsWith("http");
const KEY = "febc-editor:" + DATA.mp3 + ":" + DATA.created;
const au = document.getElementById("au");
au.src = SERVER ? "/audio" : encodeURI(DATA.mp3).replace(/#/g, "%23");
document.title = "원고 편집 - " + DATA.title;
document.getElementById("title").textContent = DATA.title;

// ---- 상태 -------------------------------------------------------------
function defaults() { return { del: DATA.lines.map(l => l.del), cut: DATA.lines.map(() => []) }; }
let st = defaults();
const valid = s => s && s.del && s.cut && s.del.length === DATA.lines.length && s.cut.length === DATA.lines.length;
if (SERVER && valid(INIT)) st = INIT;
else if (!SERVER) {
  try { const saved = JSON.parse(localStorage.getItem(KEY) || "null"); if (valid(saved)) st = saved; } catch (e) {}
}
let dirty = false, saveTimer = null;
function touch() {
  dirty = true; refreshStatus(); refreshEst();
  if (SERVER) { clearTimeout(saveTimer); saveTimer = setTimeout(autoSave, 800); }
  else localStorage.setItem(KEY, JSON.stringify(st));
}
async function autoSave() {
  try {
    const r = await fetch("/save", { method: "POST", body: buildText() });
    if (!r.ok) throw new Error(await r.text());
    dirty = false; refreshStatus();
  } catch (e) { setStatus("✖ 자동 저장 실패: 편집 서버 창이 닫혔는지 확인하세요", true); }
}
function setStatus(msg, bad) { const s = document.getElementById("status"); s.textContent = msg; s.classList.toggle("dirty", !!bad); }

// ---- 시간 표시 ---------------------------------------------------------
const fmt = s => { const m = Math.floor(s / 60), r = s - m * 60; return String(m).padStart(2, "0") + ":" + r.toFixed(2).padStart(5, "0"); };
const fmtShort = s => { const m = Math.floor(s / 60), r = Math.round(s - m * 60); return m + ":" + String(r).padStart(2, "0"); };

// ---- 그리기 ------------------------------------------------------------
const list = document.getElementById("list");
const rows = [];
DATA.lines.forEach((l, i) => {
  if (l.kind === "after" && (i === 0 || DATA.lines[i - 1].kind !== "after")) {
    const d = document.createElement("div"); d.className = "divider"; d.textContent = "여기부터 설교 이후 (찬양 안내·찬양) — 기본 삭제";
    list.appendChild(d);
  }
  const r = document.createElement("div"); r.className = "row"; r.id = "L" + i;
  if (l.dup >= 0) r.classList.add("dup");
  const pb = document.createElement("button"); pb.className = "play"; pb.textContent = "▶"; pb.title = "여기서부터 듣기";
  pb.onclick = () => playFrom(l.s);
  const cb = document.createElement("input"); cb.type = "checkbox"; cb.title = "줄 전체 삭제";
  cb.onchange = () => { st.del[i] = cb.checked; paintRow(i); touch(); };
  const tm = document.createElement("span"); tm.className = "time"; tm.textContent = fmt(l.s); tm.onclick = () => playFrom(l.s);
  const tx = document.createElement("span"); tx.className = "txt";
  l.words.forEach((w, k) => {
    const sp = document.createElement("span"); sp.className = "w"; sp.textContent = w[2];
    if (l.rep && l.rep.includes(k)) sp.classList.add("rep");
    sp.onclick = ev => { ev.stopPropagation(); toggleWord(i, k); };
    sp.ondblclick = ev => { ev.stopPropagation(); toggleWord(i, k); playFrom(Math.max(0, w[0] - 1.5)); };
    sp.title = fmt(w[0]) + " · 클릭: 이 단어 삭제/복구";
    if (k > 0) tx.appendChild(document.createTextNode(" "));
    tx.appendChild(sp);
  });
  if (!l.words.length) tx.textContent = l.t;
  if (l.kind === "callout") tx.insertAdjacentHTML("beforeend", '<span class="tag callout">청중 호응</span>');
  if (l.dup >= 0) {
    const t = document.createElement("span"); t.className = "tag dupt";
    t.textContent = (l.dupType === "restart" ? "다시 말함? → " : "중복? ↑ ") + fmtShort(DATA.lines[l.dup].s);
    t.title = "비슷한 줄로 이동해서 확인";
    t.onclick = ev => { ev.stopPropagation(); jump(l.dup); };
    tx.appendChild(t);
  }
  r.append(pb, cb, tm, tx);
  list.appendChild(r);
  rows.push({ r, cb, tx });
  paintRow(i);
});

function paintRow(i) {
  const { r, cb, tx } = rows[i];
  cb.checked = st.del[i];
  r.classList.toggle("deleted", st.del[i]);
  [...tx.querySelectorAll(".w")].forEach((sp, k) => sp.classList.toggle("cut", st.cut[i].includes(k)));
}
function toggleWord(i, k) {
  const a = st.cut[i], p = a.indexOf(k);
  if (p >= 0) a.splice(p, 1); else a.push(k);
  paintRow(i); touch();
}
function jump(i) {
  const r = rows[i].r; r.scrollIntoView({ block: "center", behavior: "smooth" });
  r.classList.remove("flash"); void r.offsetWidth; r.classList.add("flash");
}

// ---- 재생 --------------------------------------------------------------
function playFrom(t) { au.currentTime = Math.max(0, t - 0.2); au.play(); }
let playing = -1;
au.addEventListener("timeupdate", () => {
  const t = au.currentTime;
  let idx = -1;
  for (let i = 0; i < DATA.lines.length; i++) { if (DATA.lines[i].s <= t + 0.05) idx = i; else break; }
  if (idx !== playing) {
    if (playing >= 0) rows[playing].r.classList.remove("playing");
    if (idx >= 0) rows[idx].r.classList.add("playing");
    playing = idx;
  }
});
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" && e.target.type !== "checkbox") return;
  if (e.code === "Space") { e.preventDefault(); au.paused ? au.play() : au.pause(); }
  if (e.key === "n" || e.key === "N" || e.key === "ㅜ") { nextDup(); }
});

// ---- 중복 탐색 ---------------------------------------------------------
const dupIdx = DATA.lines.map((l, i) => l.dup >= 0 ? i : -1).filter(i => i >= 0);
let dupPos = -1;
function nextDup() {
  if (!dupIdx.length) { alertOnce("중복 의심 줄이 없습니다."); return; }
  dupPos = (dupPos + 1) % dupIdx.length; jump(dupIdx[dupPos]);
}
document.getElementById("nextDup").onclick = nextDup;
document.getElementById("nextDup").textContent = "다음 중복 의심 ↓ (" + dupIdx.length + ")";
let only = false;
document.getElementById("onlyDup").onclick = ev => {
  only = !only;
  ev.target.textContent = only ? "전체 보기" : "중복 의심만 보기";
  rows.forEach((x, i) => {
    const near = dupIdx.some(d => Math.abs(d - i) <= 1 || DATA.lines[d].dup === i);
    x.r.style.display = only && !near ? "none" : "";
  });
  document.querySelectorAll(".divider").forEach(d => d.style.display = only ? "none" : "");
};
function alertOnce(msg) { const s = document.getElementById("status"); s.textContent = msg; }

// ---- 예상 길이 ---------------------------------------------------------
function refreshEst() {
  let est = DATA.base;
  DATA.lines.forEach((l, i) => {
    if (st.del[i] && !l.del) est -= l.cost;
    if (!st.del[i] && l.del && l.kind !== "after") est += l.cost;
    if (!st.del[i]) st.cut[i].forEach(k => { const w = l.words[k]; est -= (w[1] - w[0]); });
  });
  const e = document.getElementById("est");
  e.textContent = "예상 송출 길이 " + fmtShort(est) + " / 25:00";
  e.classList.toggle("over", est > DATA.maxLen);
}
function refreshStatus() {
  if (SERVER) setStatus(dirty ? "저장 중…" : "✔ 원고 자동 저장됨", false);
  else setStatus(dirty ? "● 저장 안 됨 (브라우저에는 자동 보관됨)" : "저장됨", dirty);
}

// ---- 원고 저장 ---------------------------------------------------------
function buildText() {
  const L = [];
  L.push("※ 극동방송 송출용 원고 - " + DATA.title);
  L.push("※ 원본: " + DATA.mp3path);
  L.push("※ 지울 문장은 줄 맨 앞에 # 을 붙이세요. 살릴 줄은 # 을 지우세요. (줄 자체를 지우지 마세요)");
  L.push("※ 글자 오타는 고쳐도 됩니다. [ ] 안의 시간만 그대로 두세요.");
  L.push("※ 맨 아래 '단어 삭제' 목록은 편집 화면에서 단어를 클릭해 지운 것입니다.");
  L.push("※ 총 " + DATA.lines.length + "줄");
  L.push("");
  const words = [];
  DATA.lines.forEach((l, i) => {
    if (l.kind === "after" && (i === 0 || DATA.lines[i - 1].kind !== "after")) { L.push(""); L.push("======== 여기부터 설교 이후 (자동 삭제) ========"); }
    let t = l.words.length ? l.words.map((w, k) => st.cut[i].includes(k) ? "{" + w[2].trim() + "}" : w[2].trim()).join(" ") : l.t;
    if (l.kind === "callout") t += "  ← 청중 호응";
    L.push((st.del[i] ? "# " : "") + "[" + fmt(l.s) + " ~ " + fmt(l.e) + "] " + t);
    if (!st.del[i]) st.cut[i].slice().sort((a, b) => a - b).forEach(k => words.push(l.words[k]));
  });
  if (words.length) {
    L.push(""); L.push("======== 단어 삭제 ========");
    words.forEach(w => L.push("-[" + fmt(w[0]) + " ~ " + fmt(w[1]) + "] " + w[2].trim()));
  }
  return "﻿" + L.join("\r\n") + "\r\n";
}
// ---- 편집 서버 모드: 송출 파일 만들기 -------------------------------------
if (SERVER) {
  document.getElementById("save").style.display = "none";
  document.getElementById("build").style.display = "";
}
document.getElementById("build").onclick = async () => {
  const panel = document.getElementById("panel"), log = document.getElementById("plog");
  const title = document.getElementById("ptitle"), close = document.getElementById("pclose");
  clearTimeout(saveTimer);
  panel.style.display = "flex"; log.textContent = ""; close.disabled = true;
  title.textContent = "송출 파일 만드는 중… (1~2분)";
  try {
    const r = await fetch("/build", { method: "POST", body: buildText() });
    if (!r.ok) throw new Error(await r.text());
    dirty = false; refreshStatus();
    let pos = 0;
    while (true) {
      await new Promise(res => setTimeout(res, 800));
      const p = await (await fetch("/progress?from=" + pos)).json();
      log.textContent += p.text; pos = p.pos; log.scrollTop = log.scrollHeight;
      if (p.done) {
        title.textContent = p.ok ? "✔ 완성: " + p.out : "✖ 실패 — 아래 내용을 확인하세요";
        break;
      }
    }
  } catch (e) { title.textContent = "✖ 편집 서버에 연결할 수 없습니다 (서버 창이 닫혔나요?)"; log.textContent += String(e); }
  close.disabled = false;
};
document.getElementById("pclose").onclick = () => { document.getElementById("panel").style.display = "none"; };

document.getElementById("save").onclick = async () => {
  const text = buildText();
  const name = DATA.scriptName;
  try {
    if (window.showSaveFilePicker) {
      const h = await window.showSaveFilePicker({ suggestedName: name, types: [{ description: "원고", accept: { "text/plain": [".txt"] } }] });
      const w = await h.createWritable(); await w.write(text); await w.close();
    } else {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([text], { type: "text/plain;charset=utf-8" }));
      a.download = name; a.click();
    }
    dirty = false; refreshStatus();
    document.getElementById("status").textContent = "저장됨 — 이 원고 파일을 '2_송출파일만들기' 위로 끌어다 놓으세요";
  } catch (e) { if (e.name !== "AbortError") alert("저장 실패: " + e.message); }
};
document.getElementById("reset").onclick = () => {
  if (!confirm("모든 표시를 처음 상태로 되돌릴까요?")) return;
  st = defaults(); DATA.lines.forEach((_, i) => paintRow(i)); touch();
};
refreshEst();
dirty = false; refreshStatus();
window.addEventListener("beforeunload", e => {
  if (SERVER && dirty) { navigator.sendBeacon("/save", buildText()); return; }
  if (dirty) { e.preventDefault(); e.returnValue = ""; }
});
</script>
</body>
</html>
